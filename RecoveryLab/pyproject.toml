[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recoverylab"
version = "0.6.1"
description = "File recovery tool for NTFS disk images"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "RecoveryLab Team"},
]
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "Pillow>=9.0",
    "psutil>=5.9",
]
keywords = ["recovery", "ntfs", "forensics", "file-recovery", "data-recovery"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/notrabajesmas/RecoveryLab"
Repository = "https://github.com/notrabajesmas/RecoveryLab"
Issues = "https://github.com/notrabajesmas/RecoveryLab/issues"

[project.scripts]
recoverylab = "recoverylab:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools]
py-modules = ["recoverylab", "config"]
packages = [
    "core",
    "motors",
    "strategies",
    "ntfs_parser",
    "recovery_judge",
    "dataset_builder",
    "corruptor",
    "experiment_runner",
    "visualizer",
    "tools",
]

[tool.setuptools.package-data]
"*" = ["examples/*.img", "examples/*.json"]
